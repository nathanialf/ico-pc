# Posterity: the matching era's splat layout for the PAL target, kept as the record of how the ELF was split and carved. Nothing reads this file: the build takes its object order from config/link_order.pal.txt, and tools/ico_version.{py,sh} detect the target by that file.
# =============================================================================
# splat configuration — ICO (PAL retail SCES-50760, boot ELF SCES_507.60)
#
# main (PAL) 2026-09-04: the retail target moved from the USA disc to the PAL
# disc. Same toolchain and conventions as the ntsc/aug6 branches (ee-gcc
# 2.9-991111-01 + period ee-as, zero bandaids, raw one-pass splat round-trip,
# per-TU yaml data carving). USA retail (SCUS_971.13) now lives on the `ntsc`
# branch; the Aug-6-2001 prototype on `aug6`.
#
# The PAL disc ships MAIN.MAP / SRCFILE.TXT / TRFILE.TXT (a linker map and an
# objdump -dl listing of the 2002-01-16 EU master link). Names and TU order
# come from them via tools/gen_pal_symbol_addrs.py; see docs/LEGAL.md.
# Version slug: 'pal'.
#
# .text is split per translation unit (223 game TUs + 18 vendor-archive spans) by
# tools/gen_pal_symbol_addrs.py; flip [OFF, asm, NAME] -> [OFF, c, NAME] as
# TUs are ported from ntsc / matched.  Rerunning the generator preserves a
# flipped subsegment's type and name.
# =============================================================================

name: ico
sha1: a401d1e5a20b1659189a8b1026a8eb35811dc9ca  # SHA-1 of baserom/pal/baseelf.rom
options:
  basename: ico
  target_path: baserom/pal/baseelf.rom
  elf_path: build/ico.elf
  base_path: ..
  platform: ps2
  compiler: EEGCC

  # _gp from the PAL ELF's own .reginfo section (ri_gp_value = 0x00640AF0 —
  # what crt0 loads at runtime). Pinned so the link reproduces it unconditionally.
  gp_value: 0x00640AF0
  ld_gp_expression: "0x00640AF0"

  asm_path: asm
  src_path: .
  build_path: build
  hasm_in_src_path: True

  # Lock include/labels.inc — hand-edited (`jlabel visibility=global` so
  # cross-.o jumptable refs in coalesced TUs resolve at link time, and the
  # `__blob` guard blob `.s` files set); splat's default regen would revert
  # that, and would also write back the deleted modern-gas macro.inc.
  generate_asm_macros_files: False

  ld_script_path: config/ico.pal.ld
  ld_dependencies: True
  ld_wildcard_sections: True
  ld_bss_contains_common: True
  ld_bss_is_noload: true

  create_asm_dependencies: True
  create_c_files: False   # every c row has its source; a member the developers assembled is a .s beside its row (crt0, the R5900 string members) and splat must not write a .c skeleton over it
  disassemble_all: True

  find_file_boundaries: False
  migrate_rodata_to_functions: True
  use_gp_rel_macro_nonmatching: True

  o_as_suffix: True

  symbol_addrs_path:
    - config/symbol_addrs.pal.txt
    # DATA symbol names, recovered from MAIN.MAP by tools/gen_pal_data_symbols.py.
    # Kept in its own file so the two generators never rewrite each other's block.
    - config/symbol_addrs.pal.data.txt
  reloc_addrs_path:
    - config/reloc_addrs.pal.txt

  undefined_funcs_auto_path: config/undefined_funcs_auto.pal.txt
  undefined_syms_auto_path: config/undefined_syms_auto.pal.txt

  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2

  named_regs_for_c_funcs: False

  section_order:
    - .text
    # - .vutext (hasm — hand-typed VU1 microprograms, ico2/*.S via assemble_vu0.py)
    - .data
    - .rodata
    - .lit4
    - .sdata
    - .sbss
    - .bss

  auto_link_sections:
    - .data
    - .rodata
    - .lit4
    - .sdata
    - .sbss
    - .bss

# Section boundaries below are PAL-specific (from baserom/pal/baseelf.elf
# section headers; every section start is 0x80-aligned by the original
# linker, hence align: 0x80).
segments:
  - name: cod
    type: code
    start: 0x000000
    vram: 0x00100000
    bss_size: 0xFA0A2   # ROM end 0x63C0F6 to .bss end 0x736198: .sbss 0x4DC + .bss 0xF9B98 + the 0xA and 0x24 alignment gaps before .sbss and .bss
    subalign: null
    align: 0x80   # original linker 0x80-aligns every section start; splat default is 16
    subsegments:
      # --- .text 0x00100000..0x00289BC4 (+12 B pad folded into the last span,
      # which therefore runs to the 0x00289BD0 .vutext start).  One subsegment
      # per translation unit, in link order, recovered by
      # tools/gen_pal_symbol_addrs.py from the PAL disc's own SRCFILE.TXT /
      # MAIN.MAP metadata — read the provenance header in
      # config/symbol_addrs.pal.txt before trusting a name.  Every start below
      # is a rom-native, 8-byte-aligned function start (an unaligned split
      # would make the assembler insert pad and break the SHA-1).
      #
      # `sce/*` spans are SCE SDK library code, NOT ICO TUs.  A file name
      # asserts a partition, so each name is only as fine as the evidence:
      #
      #   * Where MAIN.MAP's archive-member .text rows TILE the retail run
      #     (the member window's span equals the run's, and every member
      #     start lands on an 8-aligned function start of the shipped ELF),
      #     the run is split one file per member, named for the member:
      #     libpkt, libgraph, libmc, libm, libgcc, libc and libkernl's
      #     0x2898E8 run.  libc and libm members sit under the newlib
      #     subdirectory SRCFILE.TXT names for them.  A member whose start is
      #     only 4-aligned opens its own subsegment when its section is
      #     word-aligned: libc's r5900 assembly members memcmp, strcmp,
      #     strlen, memchr and memmove are `.s` files with `.align 2`, and the
      #     linker places each at its ROM start with no fill (measured in both
      #     builds).
      #   * Where the January link carried a different revision of the
      #     archive and the member spans do NOT tile, only the ARCHIVE
      #     attribution is verified: the whole run is one file named for the
      #     archive, and the file says the member partition is unverified.
      #
      # The trailing comment names the archive MAIN.MAP's symbol table
      # attributes the span's functions to, and the member where one is
      # proven.  Attribution tags: `census` = the rom's own __FILE__
      # string proves the file; `listing` = carried over from SRCFILE.TXT by
      # reloc-normalized instruction-stream equality; `fill` = forward-filled
      # inside an already-attributed region.
      #
      # Everything is `asm` until a TU is ported from ntsc or matched; flip
      # [OFF, asm, NAME] -> [OFF, c, NAME] as that happens.  Regenerating
      # preserves the type and name of any subsegment whose start offset
      # survives, so a flipped TU is not clobbered.
      - [0x0, c, sce/crt0]  # 4 funcs, vendor crt0.s (1/4 MAIN.MAP)
      - [0x100, c, sce/libkernl/klib]  # 137 funcs, vendor libkernl.a member klib.o, assembled from klib.s (the listing), its .text 64-aligned; the seven members from here to main.c tile the run at MAIN.MAP's own addresses
      - [0x990, c, sce/libkernl/initsys]  # 3 funcs, vendor libkernl.a member initsys.o (0x74 + pad)
      - [0xA08, c, sce/libkernl/intr]  # 13 funcs, vendor libkernl.a member intr.o (0x35C + pad); holds its own static setup
      - [0xD68, c, sce/libkernl/thread]  # 5 funcs, vendor libkernl.a member thread.o (0x360)
      - [0x10C8, c, sce/libkernl/kprintf]  # 8 funcs, vendor libkernl.a member kprintf.o (0x978)
      - [0x1A40, c, sce/libkernl/diei]  # 2 funcs, vendor libkernl.a member diei.o (0x60)
      - [0x1AA0, c, sce/libkernl/deci2]  # 10 funcs, vendor libkernl.a member deci2.o (0x1E0)
      - [0x1C80, c, ico2/common/src/main]  # 8 funcs, listing; starts with Main (main.c:1011), which the listing puts in main.c and splat had left inside the libkernl run
