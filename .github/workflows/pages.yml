# The download page. site/index.html is one static file (no build step) that
# reads the releases list from GitHub's API in the visitor's browser. This
# workflow publishes site/ to GitHub Pages (https://nathanialf.github.io/ico-pc/)
# on a push to main that touches it, or by hand. The repository's Pages
# source must be set to "GitHub Actions" once (Settings > Pages > Build and
# deployment > Source). docs/BUILDING.md ("Continuous integration") has the
# details.
name: pages

on:
  push:
    branches: [main]
    paths: ['site/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
