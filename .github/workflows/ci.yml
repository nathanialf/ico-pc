# CI for the PC port. ROM-free by construction: no secrets, no disc image, no
# baserom/. Tests that need the user's disc exit 77 and ctest reports them as
# skipped (SKIP_RETURN_CODE in the CMakeLists), which is not a failure.
# docs/BUILDING.md ("Continuous integration") describes the jobs: `linux`
# (the hygiene checks and the four main builds) and `extra`, a matrix of the
# sanitizer, float-trap and Windows clang builds that runs beside it.
name: ci

on:
  push:
    branches: ['**']
    # a tag push re-tests a commit that was already tested on its branch
    tags-ignore: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CMAKE: ${{ github.workspace }}/tools/toolchain/cmake/bin
  PYBIN: ${{ github.workspace }}/.venv/bin
  # the developer compiler (Debian's gcc 14); the runner's default gcc is 13
  # (cmake/IcoFlags.cmake drops the flags a compiler does not know anyway)
  ICO_CC: gcc-14

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Host packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential gcc-14 curl xz-utils python3 python3-venv \
            libx11-dev libxext-dev libxrandr-dev libxi-dev libxcursor-dev \
            libxfixes-dev libxrender-dev libasound2-dev libpulse-dev \
            libvulkan1 mesa-vulkan-drivers
          # lavapipe (mesa-vulkan-drivers): the render tests run on the CPU
          # Vulkan driver instead of skipping

      - name: Python tools (venv)
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -r tools/requirements.txt

      # restore and save separately: actions/cache saves only when the whole
      # job succeeds, so a failing build would leave every run cold
      - name: Toolchain and dependency cache (restore)
        id: toolchain-cache
        uses: actions/cache/restore@v4
        with:
          path: tools/toolchain
          key: toolchain-${{ runner.os }}-${{ hashFiles('tools/fetch_toolchain.sh', 'tools/fetch_deps.sh') }}

      - name: Fetch toolchain and dependencies
        run: tools/fetch_toolchain.sh

      - name: Toolchain and dependency cache (save)
        if: steps.toolchain-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: tools/toolchain
          key: toolchain-${{ runner.os }}-${{ hashFiles('tools/fetch_toolchain.sh', 'tools/fetch_deps.sh') }}

      # ---- hygiene: fast, so they fail first ----
      - name: No disc data in the tree
        run: tools/check_no_rom.sh

      - name: Format
        run: tools/format.sh --check

      - name: No ICO_HOST conditional in the game sources
        run: python3 tools/strip_host_gates.py --check

      - name: Generated files are fresh
        run: |
          .venv/bin/python tools/gen_data_desc.py --check
          .venv/bin/python tools/gen_layout_asserts.py --check
          .venv/bin/python tools/gen_sources.py --check

      # ---- builds and tests ----
      - name: linux-x64, headless
        run: |
          $CMAKE/cmake --preset linux-x64 -DICO_LINK_EXE=ON -DCMAKE_C_COMPILER=$ICO_CC
          $CMAKE/cmake --build build-host/linux-x64 --parallel
          $CMAKE/ctest --test-dir build-host/linux-x64 --output-on-failure --parallel 4

      - name: linux-x64, window build
        run: |
          $CMAKE/cmake --preset linux-x64 -DICO_HEADLESS=OFF -DICO_LINK_EXE=ON \
            -DCMAKE_C_COMPILER=$ICO_CC \
            -B build-host/linux-x64-window
          $CMAKE/cmake --build build-host/linux-x64-window --parallel
          $CMAKE/ctest --test-dir build-host/linux-x64-window --output-on-failure --parallel 4

      - name: linux-x64-clang
        run: |
          $CMAKE/cmake --preset linux-x64-clang -DICO_LINK_EXE=ON
          $CMAKE/cmake --build build-host/linux-x64-clang --parallel
          $CMAKE/ctest --test-dir build-host/linux-x64-clang --output-on-failure --parallel 4

      - name: win-x64 (cross-compiled; the tests are built, not run)
        run: |
          $CMAKE/cmake --preset win-x64 -DICO_LINK_EXE=ON
          $CMAKE/cmake --build build-host/win-x64 --parallel
          test -f build-host/win-x64/ico_pc.exe
          test -f build-host/win-x64/SDL3.dll

  # The presets the main job does not build, one runner each so the job
  # stays well inside its timeout. Each restores the toolchain the `linux`
  # job caches (and fetches it on a miss); only `linux` saves it.
  extra:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        preset: [asan, fptrap, win-x64-clang]
    steps:
      - uses: actions/checkout@v4

      - name: Host packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential gcc-14 curl xz-utils python3 python3-venv \
            libx11-dev libxext-dev libxrandr-dev libxi-dev libxcursor-dev \
            libxfixes-dev libxrender-dev libasound2-dev libpulse-dev \
            libvulkan1 mesa-vulkan-drivers

      - name: Python tools (venv)
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -r tools/requirements.txt

      - name: Toolchain and dependency cache (restore)
        uses: actions/cache/restore@v4
        with:
          path: tools/toolchain
          key: toolchain-${{ runner.os }}-${{ hashFiles('tools/fetch_toolchain.sh', 'tools/fetch_deps.sh') }}

      - name: Fetch toolchain and dependencies
        run: tools/fetch_toolchain.sh

      # asan: AddressSanitizer + UBSan (Debug, -O1); fptrap: float
      # divide-by-zero and invalid trap. Headless with the exe linked, as the
      # linux-x64 headless step.
      - name: ${{ matrix.preset }}
        if: matrix.preset != 'win-x64-clang'
        run: |
          $CMAKE/cmake --preset ${{ matrix.preset }} -DICO_LINK_EXE=ON -DCMAKE_C_COMPILER=$ICO_CC
          $CMAKE/cmake --build build-host/${{ matrix.preset }} --parallel
          $CMAKE/ctest --test-dir build-host/${{ matrix.preset }} --output-on-failure --parallel 4

      - name: win-x64-clang (cross-compiled; the tests are built, not run)
        if: matrix.preset == 'win-x64-clang'
        run: |
          # the window build, as win-x64 (the preset itself is headless)
          $CMAKE/cmake --preset win-x64-clang -DICO_HEADLESS=OFF -DICO_LINK_EXE=ON
          $CMAKE/cmake --build build-host/win-x64-clang --parallel
          test -f build-host/win-x64-clang/ico_pc.exe
          test -f build-host/win-x64-clang/SDL3.dll
