# CI for the PC port. ROM-free by construction: no secrets, no disc image, no
# baserom/. Tests that need the user's disc exit 77 and ctest reports them as
# skipped (SKIP_RETURN_CODE in the CMakeLists), which is not a failure.
# docs/BUILDING.md ("Continuous integration") describes the jobs: `linux`
# (the hygiene checks and the four main builds), `windows`, the renderer's
# tests from the `linux` job's win-x64 build run on Direct3D 11 through WARP
# on a Windows runner (after `linux`), `extra`, a matrix of the
# sanitizer, float-trap and Windows clang builds, `linux-arm64`, the arm64
# Linux build and tests on an arm64 runner (and on a pushed v* tag the arm64
# package), and `android`, the APK build and
# its structural checks; all but `windows` run side by side.
name: ci

on:
  push:
    branches: [main]
    # a release tag also builds the Linux arm64 package (the linux-arm64 job)
    tags: ['v*']
  pull_request:
  # the arm64 package of a release whose tag's run failed its tests for a
  # reason fixed since (a test's tolerance): only the linux-arm64 job runs,
  # from the dispatched branch, labelled with the tag, after checking that
  # the branch differs from the tag only under tests, docs and .github
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag whose linux-arm64 package to build from this branch (vX.Y.Z); the release must exist"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  # a dispatched run (the arm64 package) never cancels main's push run
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CMAKE: ${{ github.workspace }}/tools/toolchain/cmake/bin
  # the developer compiler (Debian's gcc 14); the runner's default gcc is 13
  # (cmake/IcoFlags.cmake drops the flags a compiler does not know anyway)
  ICO_CC: gcc-14
  # the ccache caches are saved per commit: keep each one to this size
  CCACHE_MAXSIZE: 5G

jobs:
  linux:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Host packages
        # the runner's package mirror sometimes hangs for an hour (2026-10-07,
        # twice): a short step timeout and one retry instead of the job's 120
        timeout-minutes: 10
        run: |
          for try in 1 2; do
            sudo apt-get update && break
            sleep 30
          done
          sudo apt-get install -y --no-install-recommends \
            build-essential gcc-14 curl xz-utils python3 python3-venv \
            libx11-dev libxext-dev libxrandr-dev libxi-dev libxcursor-dev \
            libxfixes-dev libxrender-dev libasound2-dev libpulse-dev \
            libpipewire-0.3-dev libspa-0.2-dev \
            libdbus-1-dev libxss-dev \
            libgl-dev libglx-dev libegl-dev libgl1 libegl1 libgl1-mesa-dri \
            libvulkan1 mesa-vulkan-drivers
          # lavapipe (mesa-vulkan-drivers): the render tests run on the CPU
          # Vulkan driver instead of skipping
          # llvmpipe (libgl1-mesa-dri, libgl1, libegl1): the OpenGL tests run on
          # the CPU OpenGL driver; the GL headers build SDL with GLX and EGL

      - name: Python tools (venv)
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -r tools/requirements.txt

      # restore and save separately: actions/cache saves only when the whole
      # job succeeds, so a failing build would leave every run cold
      - name: Toolchain and dependency cache (restore)
        id: toolchain-cache
        uses: actions/cache/restore@v4
        with:
          path: tools/toolchain
          key: toolchain-${{ runner.os }}-${{ hashFiles('tools/fetch_toolchain.sh', 'tools/fetch_deps.sh', 'tools/fetch_common.sh', 'tools/fetch_android.sh') }}

      - name: Fetch toolchain and dependencies
        run: tools/fetch_toolchain.sh

      - name: Toolchain and dependency cache (save)
        if: steps.toolchain-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: tools/toolchain
          key: toolchain-${{ runner.os }}-${{ hashFiles('tools/fetch_toolchain.sh', 'tools/fetch_deps.sh', 'tools/fetch_common.sh', 'tools/fetch_android.sh') }}

      # ccache (the presets' compiler launcher, tools/toolchain/ccache): the
      # cache is keyed by this job and the toolchain files that pin the compiler
      # and the ccache version, and saved even when a later step fails
      - name: ccache (restore)
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ccache
          key: ccache-linux-${{ runner.os }}-${{ hashFiles('tools/fetch_toolchain.sh', 'tools/fetch_deps.sh', 'tools/fetch_common.sh', 'tools/fetch_android.sh') }}-${{ github.sha }}
          restore-keys: |
            ccache-linux-${{ runner.os }}-${{ hashFiles('tools/fetch_toolchain.sh', 'tools/fetch_deps.sh', 'tools/fetch_common.sh', 'tools/fetch_android.sh') }}-

      # ---- hygiene: fast, so they fail first ----
      - name: No disc data in the tree
        run: tools/check_no_rom.sh

      - name: Format
        run: tools/format.sh --check

      - name: No ICO_HOST conditional in the game sources
        run: python3 tools/strip_host_gates.py --check

      - name: No compile-time region block in the game sources
        run: |
          python3 tools/region_blocks.py --selftest
          python3 tools/region_blocks.py check

      - name: No stack-layout reliance in the game sources
        run: |
          python3 tools/stack_overread_audit.py --selftest
          python3 tools/stack_overread_audit.py

      # a fixed buffer cast to a struct that is wider on the host
      - name: No buffer cast to a wider struct in the game sources
        run: |
          python3 tools/struct_cast_audit.py --selftest
          python3 tools/struct_cast_audit.py

      # a call that passes fewer arguments than its target reads, an extern
      # that disagrees with its definition
      - name: Calls and declarations agree with the definitions
        run: python3 tools/check_call_types.py

      - name: Generated files are fresh
        run: |
          .venv/bin/python tools/gen_data_desc.py --check
          .venv/bin/python tools/gen_layout_asserts.py --check
          .venv/bin/python tools/gen_sources.py --check

      # ---- builds and tests ----
      - name: linux-x64, headless
        run: |
          $CMAKE/cmake --preset linux-x64 -DICO_LINK_EXE=ON -DCMAKE_C_COMPILER=$ICO_CC
          $CMAKE/cmake --build build-host/linux-x64 --parallel --target all tests
          $CMAKE/ctest --test-dir build-host/linux-x64 --output-on-failure --parallel 4
          # every shader entry with the Direct3D 11 macro (ICO_D3D11=1): the
          # flat-register preprocessing compiles (FXC itself runs on Windows only)
          $CMAKE/cmake --build build-host/linux-x64 --parallel --target shaders_d3d11_check

      - name: linux-x64, window build
        run: |
          $CMAKE/cmake --preset linux-x64 -DICO_HEADLESS=OFF -DICO_LINK_EXE=ON \
            -DCMAKE_C_COMPILER=$ICO_CC \
            -B build-host/linux-x64-window
          $CMAKE/cmake --build build-host/linux-x64-window --parallel --target all tests
          $CMAKE/ctest --test-dir build-host/linux-x64-window --output-on-failure --parallel 4

      - name: linux-x64-clang
        run: |
          $CMAKE/cmake --preset linux-x64-clang -DICO_LINK_EXE=ON
          $CMAKE/cmake --build build-host/linux-x64-clang --parallel --target all tests
          $CMAKE/ctest --test-dir build-host/linux-x64-clang --output-on-failure --parallel 4

      - name: win-x64 (cross-compiled; the tests are built, the `windows` job runs some)
        run: |
          $CMAKE/cmake --preset win-x64 -DICO_LINK_EXE=ON
          $CMAKE/cmake --build build-host/win-x64 --parallel --target all tests
          test -f build-host/win-x64/ico_pc.exe
          test -f build-host/win-x64/SDL3.dll
          # the renderer's tests the `windows` job runs on Direct3D 11
          # through WARP, with SDL3.dll (their only non-system import)
          tools/ci_d3d11_warp.sh stage build-host/win-x64 build-host/win-x64-warp

      - name: Upload the win-x64 test programs (for the `windows` job)
        uses: actions/upload-artifact@v4
        with:
          name: win-x64-warp-tests
          path: build-host/win-x64-warp/
          retention-days: 7
          if-no-files-found: error

      - name: ccache (save)
        if: ${{ !cancelled() }}
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ccache
          key: ccache-linux-${{ runner.os }}-${{ hashFiles('tools/fetch_toolchain.sh', 'tools/fetch_deps.sh', 'tools/fetch_common.sh', 'tools/fetch_android.sh') }}-${{ github.sha }}

  # The renderer's tests on Direct3D 11 through WARP, Microsoft's software
  # adapter, on GitHub's Windows runner (issue 126: the Direct3D 11 backend
  # is exercised on no other CI device). The programs are the
  # `linux` job's win-x64 cross build (its artifact win-x64-warp-tests);
  # tools/ci_d3d11_warp.sh runs each with ICO_RHI_BACKEND=d3d11 and
  # ICO_D3D11_ADAPTER=warp and its own expectations, prints a failed test's
  # device line, debug-layer lines and log end, and the logs are kept as an
  # artifact. ICO_D3D11_DEBUG=1 asks for the debug layer: the step before
  # tries to add it (Windows' optional feature "Graphics Tools") and the
  # device line in each log says whether it was there; its absence fails
  # nothing. docs/port/TESTING.md ("The render suite on Direct3D 11 (WARP)")
  # lists what runs.
  windows:
    if: github.event_name != 'workflow_dispatch'
    needs: linux
    runs-on: windows-2022
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: The win-x64 test programs
        uses: actions/download-artifact@v4
        with:
          name: win-x64-warp-tests
          path: warp

      - name: Direct3D 11 debug layer (Graphics Tools; not gating)
        continue-on-error: true
        timeout-minutes: 5
        shell: pwsh
        run: |
          $cap = Get-WindowsCapability -Online -Name 'Tools.Graphics.DirectX*'
          $cap | Format-Table -AutoSize Name, State
          if ($cap -and $cap.State -ne 'Installed') { $cap | Add-WindowsCapability -Online | Out-Null }
          Get-WindowsCapability -Online -Name 'Tools.Graphics.DirectX*' | Format-Table -AutoSize Name, State
          if (Test-Path "$env:WINDIR\System32\d3d11_3SDKLayers.dll") { 'd3d11_3SDKLayers.dll: present' } else { 'd3d11_3SDKLayers.dll: absent' }

      - name: Renderer tests on Direct3D 11 (WARP)
        shell: bash
        env:
          ICO_RHI_BACKEND: d3d11
          ICO_D3D11_ADAPTER: warp
          ICO_D3D11_DEBUG: '1'
        run: tools/ci_d3d11_warp.sh run warp warp-logs

      - name: Upload the logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: d3d11-warp-logs
          path: |
            warp-logs/
            warp/work/*.png
          retention-days: 14
          if-no-files-found: warn

  # The presets the main job does not build, one runner each so the job
  # stays well inside its timeout. Each restores the toolchain the `linux`
  # job caches (and fetches it on a miss); only `linux` saves it.
  extra:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        preset: [asan, fptrap, win-x64-clang]
    steps:
      - uses: actions/checkout@v4

      - name: Host packages
        # the runner's package mirror sometimes hangs for an hour (2026-10-07,
        # twice): a short step timeout and one retry instead of the job's 120
        timeout-minutes: 10
        run: |
          for try in 1 2; do
            sudo apt-get update && break
            sleep 30
          done
          sudo apt-get install -y --no-install-recommends \
            build-essential gcc-14 curl xz-utils python3 python3-venv \
            libx11-dev libxext-dev libxrandr-dev libxi-dev libxcursor-dev \
            libxfixes-dev libxrender-dev libasound2-dev libpulse-dev \
            libpipewire-0.3-dev libspa-0.2-dev \
            libdbus-1-dev libxss-dev \
            libgl-dev libglx-dev libegl-dev libgl1 libegl1 libgl1-mesa-dri \
            libvulkan1 mesa-vulkan-drivers

      - name: Python tools (venv)
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -r tools/requirements.txt

      - name: Toolchain and dependency cache (restore)
        uses: actions/cache/restore@v4
        with:
          path: tools/toolchain
          key: toolchain-${{ runner.os }}-${{ hashFiles('tools/fetch_toolchain.sh', 'tools/fetch_deps.sh', 'tools/fetch_common.sh', 'tools/fetch_android.sh') }}

      - name: Fetch toolchain and dependencies
        run: tools/fetch_toolchain.sh

      # ccache (the presets' compiler launcher, tools/toolchain/ccache): the
      # cache is keyed by the preset and the toolchain files that pin the compiler
      # and the ccache version, and saved even when a later step fails
      - name: ccache (restore)
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ matrix.preset }}-${{ runner.os }}-${{ hashFiles('tools/fetch_toolchain.sh', 'tools/fetch_deps.sh', 'tools/fetch_common.sh', 'tools/fetch_android.sh') }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ matrix.preset }}-${{ runner.os }}-${{ hashFiles('tools/fetch_toolchain.sh', 'tools/fetch_deps.sh', 'tools/fetch_common.sh', 'tools/fetch_android.sh') }}-

      # asan: AddressSanitizer + UBSan (Debug, -O1); fptrap: float
      # divide-by-zero and invalid trap. Headless with the exe linked, as the
      # linux-x64 headless step.
      - name: ${{ matrix.preset }}
        if: matrix.preset != 'win-x64-clang'
        run: |
          $CMAKE/cmake --preset ${{ matrix.preset }} -DICO_LINK_EXE=ON -DCMAKE_C_COMPILER=$ICO_CC
          $CMAKE/cmake --build build-host/${{ matrix.preset }} --parallel --target all tests
          $CMAKE/ctest --test-dir build-host/${{ matrix.preset }} --output-on-failure --parallel 4

      - name: win-x64-clang (cross-compiled; the tests are built, not run)
        if: matrix.preset == 'win-x64-clang'
        run: |
          # the window build, as win-x64 (the preset itself is headless)
          $CMAKE/cmake --preset win-x64-clang -DICO_HEADLESS=OFF -DICO_LINK_EXE=ON
          $CMAKE/cmake --build build-host/win-x64-clang --parallel --target all tests
          test -f build-host/win-x64-clang/ico_pc.exe
          test -f build-host/win-x64-clang/SDL3.dll

      - name: ccache (save)
        if: ${{ !cancelled() }}
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ matrix.preset }}-${{ runner.os }}-${{ hashFiles('tools/fetch_toolchain.sh', 'tools/fetch_deps.sh', 'tools/fetch_common.sh', 'tools/fetch_android.sh') }}-${{ github.sha }}

  # The linux-arm64 preset on GitHub's arm64 runner, built and tested. Its
  # toolchain cache has its own key (an arm64 host fetches aarch64 tools and
  # builds DXC from source) and is saved by this job. docs/BUILDING.md
  # ("Continuous integration") says why some render tests are left out.
  linux-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Host packages
        timeout-minutes: 10
        run: |
          for try in 1 2; do
            sudo apt-get update && break
            sleep 30
          done
          sudo apt-get install -y --no-install-recommends \
            build-essential gcc-14 g++ git curl xz-utils python3 python3-venv \
            libx11-dev libxext-dev libxrandr-dev libxi-dev libxcursor-dev \
            libxfixes-dev libxrender-dev libasound2-dev libpulse-dev \
            libpipewire-0.3-dev libspa-0.2-dev \
            libdbus-1-dev libxss-dev \
            libgl-dev libglx-dev libegl-dev libgl1 libegl1 libgl1-mesa-dri \
            libwayland-dev wayland-protocols libxkbcommon-dev libdecor-0-dev \
            libdrm-dev libgbm-dev \
            libvulkan1 mesa-vulkan-drivers

      - name: Python tools (venv)
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -r tools/requirements.txt

      - name: Toolchain and dependency cache (restore)
        id: toolchain-cache
        uses: actions/cache/restore@v4
        with:
          path: tools/toolchain
          key: toolchain-arm64-${{ runner.os }}-${{ hashFiles('tools/fetch_toolchain.sh', 'tools/fetch_deps.sh', 'tools/fetch_common.sh', 'tools/fetch_android.sh') }}

      - name: Fetch toolchain and dependencies
        run: tools/fetch_toolchain.sh

      - name: Toolchain and dependency cache (save)
        if: steps.toolchain-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: tools/toolchain
          key: toolchain-arm64-${{ runner.os }}-${{ hashFiles('tools/fetch_toolchain.sh', 'tools/fetch_deps.sh', 'tools/fetch_common.sh', 'tools/fetch_android.sh') }}

      - name: No disc data in the tree
        run: tools/check_no_rom.sh

      # lavapipe on arm64 misses the filtered-pixel comparisons by an LSB or
      # two (docs/BUILDING.md): those programs and every variant of them
      # (rd_present_depth_copy, the _nodual, _minlimits and _mali runs) are
      # left out here, and rd_replay_tool with them because it needs
      # rd_pixel's dump
      - name: linux-arm64
        run: |
          $CMAKE/cmake --preset linux-arm64 -DCMAKE_C_COMPILER=$ICO_CC
          $CMAKE/cmake --build build-host/linux-arm64 --parallel --target all tests
          $CMAKE/ctest --test-dir build-host/linux-arm64 --output-on-failure --parallel 4 \
            -E '^(rd_(pixel|gsbase|present|crt)(_[a-z0-9_]+)?|rd_replay_tool(_list)?)$'

      # the tests left out above, run for the log only: a failure here does
      # not fail the job, but their output shows what an arm64 change did
      - name: linux-arm64, filtered-pixel render tests (not gating)
        continue-on-error: true
        run: |
          $CMAKE/ctest --test-dir build-host/linux-arm64 --output-on-failure --parallel 4 \
            -R '^(rd_(pixel|gsbase|present|crt)(_[a-z0-9_]+)?|rd_replay_tool(_list)?)$'

      # A pushed release tag (never a pull request): the Linux arm64 package
      # (normal and portable archives, and the aarch64 AppImage) of the tagged commit, which the maintainer's x86-64 machine cannot
      # build, kept as an artifact named after the tag with their SHA-256s and
      # the packaging log (docs/BUILDING.md, "Packages"). package_linux.sh
      # writes the AppImage's .sha256 itself; the AppImage tools come with
      # the toolchain fetch above (tools/fetch_deps.sh), so apt needs
      # nothing more. The preset names
      # plain gcc; a gcc directory first on PATH makes that the gcc 14 the
      # tests above were built with.
      # A dispatched run names a tag instead: the package is built from the
      # dispatched branch, which must match the tag's commit everywhere but
      # the tests, the docs and the workflows (the tag's own run failed a
      # test since fixed; the game's sources are the tag's).
      - name: The dispatched branch matches the tag outside tests, docs and workflows
        if: github.event_name == 'workflow_dispatch'
        run: |
          git fetch --depth=1 origin "refs/tags/${{ inputs.tag }}:refs/tags/${{ inputs.tag }}"
          changed=$(git diff --name-only "${{ inputs.tag }}" HEAD -- . ':!*/test/*' ':!docs/*' ':!.github/*')
          [ -z "$changed" ] || { echo "differs from ${{ inputs.tag }}:"; echo "$changed"; exit 1; }

      - name: Package linux-arm64 (release tags only)
        if: (github.event_name == 'push' && github.ref_type == 'tag') || github.event_name == 'workflow_dispatch'
        env:
          LABEL: ${{ inputs.tag || github.ref_name }}
        run: |
          mkdir -p "$RUNNER_TEMP/gcc14"
          ln -sf "$(command -v "$ICO_CC")" "$RUNNER_TEMP/gcc14/gcc"
          PATH="$RUNNER_TEMP/gcc14:$PATH" tools/package_linux.sh "$LABEL"
          cd dist
          for n in "ico-pc-$LABEL-linux-arm64.tar.gz" \
              "ico-pc-$LABEL-linux-arm64-portable.tar.gz"; do
            sha256sum "$n" > "$n.sha256"
          done

      - name: Upload the linux-arm64 package (release tags only)
        if: ${{ !cancelled() && ((github.event_name == 'push' && github.ref_type == 'tag') || github.event_name == 'workflow_dispatch') }}
        uses: actions/upload-artifact@v4
        with:
          name: ico-pc-${{ inputs.tag || github.ref_name }}-linux-arm64
          path: |
            dist/ico-pc-${{ inputs.tag || github.ref_name }}-linux-arm64.tar.gz
            dist/ico-pc-${{ inputs.tag || github.ref_name }}-linux-arm64.tar.gz.sha256
            dist/ico-pc-${{ inputs.tag || github.ref_name }}-linux-arm64-portable.tar.gz
            dist/ico-pc-${{ inputs.tag || github.ref_name }}-linux-arm64-portable.tar.gz.sha256
            dist/ico-pc-${{ inputs.tag || github.ref_name }}-linux-aarch64.AppImage
            dist/ico-pc-${{ inputs.tag || github.ref_name }}-linux-aarch64.AppImage.sha256
            build-host/pkg-linux-arm64-${{ inputs.tag || github.ref_name }}.log
          retention-days: 30
          if-no-files-found: error

  # The Android APK (arm64-v8a), debug-signed, built with the Gradle project in
  # android/ and checked structurally; the game is not run. The toolchain
  # cache has its own key (it also holds the Android SDL3 build) and is saved by
  # this job.
  android:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/wrapper-validation@v4

      - name: Host packages
        timeout-minutes: 10
        run: |
          for try in 1 2; do
            sudo apt-get update && break
            sleep 30
          done
          sudo apt-get install -y --no-install-recommends \
            build-essential curl xz-utils python3 python3-venv

      - name: Python tools (venv)
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -r tools/requirements.txt

      - name: Toolchain and dependency cache (restore)
        id: toolchain-cache
        uses: actions/cache/restore@v4
        with:
          path: tools/toolchain
          key: toolchain-android-${{ runner.os }}-${{ hashFiles('tools/fetch_toolchain.sh', 'tools/fetch_deps.sh', 'tools/fetch_common.sh', 'tools/fetch_android.sh') }}

      - name: Fetch toolchain and dependencies (no SDL3 for the host)
        env:
          SKIP_SDL3_LINUX: '1'
          SKIP_SDL3_MINGW: '1'
          SKIP_VALIDATION_LAYER: '1'
        run: tools/fetch_toolchain.sh

      # the runner has the Android SDK (ANDROID_SDK_ROOT); the script adds the
      # NDK, platform and build-tools it pins, builds SDL3 for arm64 and
      # writes android/local.properties
      - name: Fetch the Android build tools
        run: tools/fetch_android.sh

      - name: Toolchain and dependency cache (save)
        if: steps.toolchain-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: tools/toolchain
          key: toolchain-android-${{ runner.os }}-${{ hashFiles('tools/fetch_toolchain.sh', 'tools/fetch_deps.sh', 'tools/fetch_common.sh', 'tools/fetch_android.sh') }}

      - name: No disc data in the tree
        run: tools/check_no_rom.sh

      - name: Build the debug APK
        run: cd android && ./gradlew --no-daemon assembleDebug -PicoLabel=ci

      # the game's semantics options (cmake/IcoFlags.cmake) reach the NDK
      # clang, no game object holds a fused multiply-add (arm64 has them),
      # and no object stores onto its stack protector's guard (only this
      # build has -fstack-protector-strong)
      - name: Game compile options in the Android build
        run: tools/check_android_flags.sh

      - name: APK structure
        run: |
          set -euxo pipefail
          . tools/toolchain/android.env
          apk=$(ls android/app/build/outputs/apk/debug/*.apk | head -n 1)
          bt="$ICO_ANDROID_BUILD_TOOLS"
          llvm="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin"
          so=$(ls android/app/build/intermediates/cxx/*/*/obj/arm64-v8a/libmain.so | head -n 1)
          echo "apk: $apk"
          echo "unstripped: $so"

          # the files the app needs
          unzip -l "$apk" > apk.lst
          for f in lib/arm64-v8a/libmain.so lib/arm64-v8a/libSDL3.so \
                   lib/arm64-v8a/libmain_hook.so lib/arm64-v8a/libhook_impl.so \
                   lib/arm64-v8a/libfile_redirect_hook.so assets/VERSION.txt assets/NOTICES.txt; do
            grep -q " $f\$" apk.lst || { echo "APK lacks $f"; exit 1; }
          done
          # libadrenotools' three hook libraries (the graphics driver loader),
          # no more
          hooks=$(grep -c ' lib/arm64-v8a/lib[^/]*hook[^/]*\.so$' apk.lst || true)
          [ "$hooks" -eq 3 ] || { echo "APK holds $hooks hook libraries, expected 3"; exit 1; }

          # 16 KB pages: every LOAD segment of every library (libmain, SDL3 and
          # the three hook libraries) aligned to 0x4000
          mkdir -p apk-libs
          unzip -o -q "$apk" 'lib/arm64-v8a/*.so' -d apk-libs
          for lib in apk-libs/lib/arm64-v8a/*.so; do
            "$llvm/llvm-readelf" -lW "$lib" | awk -v lib="$lib" '
              $1 == "LOAD" { n++; if ($NF != "0x4000") { print lib ": LOAD align " $NF; bad = 1 } }
              END { if (n == 0) { print lib ": no LOAD segment"; bad = 1 } exit bad }'
          done

          # the APK is zip-aligned for 16 KB pages
          "$bt/zipalign" -c -P 16 -v 4 "$apk" | tail -n 20

          # manifest levels
          "$bt/aapt2" dump badging "$apk" > badging.txt
          grep -q "minSdkVersion:'29'" badging.txt
          grep -q "targetSdkVersion:'35'" badging.txt

          # full screen: resizable for folding phones, the cutout theme, and a
          # configChanges list that keeps a density change from recreating
          # the activity (SDL quits the game on recreation)
          "$bt/aapt2" dump xmltree --file AndroidManifest.xml "$apk" > manifest.txt
          grep -q 'resizeableActivity.*true' manifest.txt
          if grep -q 'resizeableActivity.*false' manifest.txt; then echo "resizeableActivity is false"; exit 1; fi
          grep -q 'android:theme' manifest.txt
          # the libraries are unpacked at install
          # (useLegacyPackaging), where libadrenotools loads its hooks from
          grep -q 'extractNativeLibs.*true' manifest.txt
          if grep -q 'extractNativeLibs.*false' manifest.txt; then echo "extractNativeLibs is false"; exit 1; fi
          grep -q 'density' android/app/src/main/AndroidManifest.xml
          # the APK's own: configChanges is there, and when aapt2 prints it as
          # a mask, the density bit (0x1000) is set
          grep -q 'configChanges' manifest.txt
          cc=$(grep -o 'configChanges(.*' manifest.txt | head -n1 | tr -d '\r')
          hex=$(echo "$cc" | grep -o '0x[0-9a-fA-F]*$' || true)
          if [ -n "$hex" ]; then
            if [ $(( hex & 0x1000 )) -eq 0 ]; then echo "configChanges $hex lacks density"; exit 1; fi
          else
            echo "$cc" | grep -q 'density'
          fi

          # SDL_main is exported (SDL's Java glue calls it)
          # (nm's output goes to a file first: grep -q closing the pipe makes nm exit 74 where SIGPIPE is ignored)
          "$llvm/llvm-nm" -D "$so" > nm.txt
          grep -q ' T SDL_main' nm.txt

          # CI's APK is no release candidate's: no rc row (ICO_RC_TOOLS,
          # docs/BUILDING.md "Release candidate tools") in any entry
          python3 -I tools/check_rc_text.py --label ci "$apk"

          # no compiled shaders from the DXC step in the program
          n=$(strings "$so" | grep -c DXBC || true)
          [ "$n" -eq 0 ] || { echo "DXBC found in libmain.so ($n lines)"; exit 1; }

          # keep the unstripped library and the link map for the artifact
          mkdir -p android-symbols
          cp "$so" android-symbols/libmain.so
          # the map is beside libmain.so (or under .cxx), as tools/package_android.sh finds it
          map=$(ls android/app/build/intermediates/cxx/*/*/obj/arm64-v8a/ico_pc.map \
                android/app/.cxx/*/*/arm64-v8a/ico_pc.map 2>/dev/null | head -n 1 || true)
          [ -n "$map" ] || { echo "no ico_pc.map beside libmain.so or under android/app/.cxx"; exit 1; }
          cp "$map" android-symbols/ico_pc.map
          cp "$apk" android-symbols/

      - uses: actions/upload-artifact@v4
        with:
          name: ico-pc-android-debug
          path: android-symbols/
          retention-days: 14
          if-no-files-found: error
