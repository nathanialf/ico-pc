# The Apple packages: the unsigned iPhone IPA and the macOS app, built by
# .github/workflows/apple-build.yml (the same steps ci.yml's apple jobs run on
# every push to main and pull request).
#   - a published release: each platform built from the release's tag and
#     attached to it (a failure of one never touches the other's files);
#   - a dispatch with `tag` (the release must exist): the same, by hand;
#   - a dispatch with check_only: the dispatched branch built for both
#     platforms and kept as the run's artifacts, no release needed and
#     nothing attached (`tag`, optional there, only labels the files).
# docs/BUILDING.md ("Continuous integration") describes the jobs.
name: Apple packages

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and attach to (vX.Y.Z; the release must exist). With check_only: an optional label for the files"
        required: false
        default: ''
        type: string
      check_only:
        description: "Build the dispatched branch and keep the packages as the run's artifacts; attach nothing"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-ios:
    uses: ./.github/workflows/apple-build.yml
    with:
      platform: ios
      # a check builds the dispatched commit; a release its tag
      ref: ${{ !(github.event_name == 'workflow_dispatch' && inputs.check_only) && (github.event.release.tag_name || inputs.tag) || '' }}
      label: ${{ github.event.release.tag_name || inputs.tag }}
      release: ${{ !(github.event_name == 'workflow_dispatch' && inputs.check_only) }}
      upload: true

  publish-ios:
    needs: build-ios
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.check_only) }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ico-pc-ios-${{ github.run_number }}
          path: dist
      - name: Attach IPA to the published release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          gh release upload "$RELEASE_TAG" \
            "dist/ico-pc-$RELEASE_TAG-ios-unsigned.ipa" \
            --clobber --repo "$GITHUB_REPOSITORY"

  # The Apple-silicon macOS app: its own pair of jobs, so a failure here
  # never touches the IPA
  build-macos:
    uses: ./.github/workflows/apple-build.yml
    with:
      platform: macos
      ref: ${{ !(github.event_name == 'workflow_dispatch' && inputs.check_only) && (github.event.release.tag_name || inputs.tag) || '' }}
      label: ${{ github.event.release.tag_name || inputs.tag }}
      release: ${{ !(github.event_name == 'workflow_dispatch' && inputs.check_only) }}
      upload: true

  publish-macos:
    needs: build-macos
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.check_only) }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ico-pc-macos-${{ github.run_number }}
          path: dist
      - name: Attach the macOS app to the published release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          gh release upload "$RELEASE_TAG" \
            "dist/ico-pc-$RELEASE_TAG-macos-arm64.zip" \
            "dist/ico-pc-$RELEASE_TAG-macos-arm64.dmg" \
            --clobber --repo "$GITHUB_REPOSITORY"
