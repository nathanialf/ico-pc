# android/gradle.properties: the build's memory and parallelism limits (the
# build host has 4 cores and 12 GB; run ./gradlew --no-daemon).
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.workers.max=2
org.gradle.parallel=false
org.gradle.daemon=false
org.gradle.caching=false
# AndroidX libraries (androidx.window, app/build.gradle); nothing old to
# translate, so no Jetifier
android.useAndroidX=true
android.nonTransitiveRClass=true
# parallel compile jobs of the native (CMake/ninja) build; links run one at a time
icoNativeJobs=2
