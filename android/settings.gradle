// android/settings.gradle: the Android app (arm64-v8a APK). The native part is
// the repository's own CMake build (../CMakeLists.txt), driven by the Android
// Gradle plugin; tools/fetch_android.sh sets up the NDK, SDL3 and
// local.properties first.
pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}
rootProject.name = 'ico-pc'
include ':app'
